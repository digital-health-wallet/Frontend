@if (isContextoAgendamento) {
  <div class="breadcrumb">
    <span>Voltar / </span><span>Agendamento / </span><span>Editar - Agendamento / Adicionar - Documento</span>
  </div>
}

<div class="page-header">{{ tituloDaPagina }}</div>

<div class="cards-grid">
  <a class="action-card" (click)="abrirModalReceita()">
    <i class="pi pi-file-plus" style="font-size: 2.5rem; color: var(--color-primary);"></i>
    <span>Cadastrar receitas</span>
  </a>

  <a class="action-card" (click)="abrirModalExame()">
    <i class="pi pi-star" style="font-size: 2.5rem; color: var(--color-primary);"></i>
    <span>Cadastrar exames</span>
  </a>

  <a class="action-card" (click)="abrirModalDiagnostico()">
    <i class="pi pi-heart" style="font-size: 2.5rem; color: var(--color-primary);"></i>
    <span>Diagnóstico</span>
  </a>

  <a routerLink="visualizar" class="action-card">
    <i class="pi pi-eye" style="font-size: 2.5rem; color: var(--color-primary);"></i>
    <span>Visualizar</span>
  </a>
</div>

<p-dialog 
  [(visible)]="modalDiagnosticoAberto" 
  [modal]="true" 
  [draggable]="false" 
  [resizable]="false"
  styleClass="modal-agendamento"
  [style]="{ width: '100%', maxWidth: '600px' }" 
  appendTo="body">
  <app-diagnostico-form *ngIf="modalDiagnosticoAberto()" [idAgendamento]="idAgendamento!" (aoSalvar)="fecharModais()"></app-diagnostico-form>
</p-dialog>

<p-dialog 
  [(visible)]="modalReceitaAberta" 
  [modal]="true" 
  [draggable]="false" 
  [resizable]="false"
  styleClass="modal-agendamento"
  [style]="{ width: '100%', maxWidth: '600px' }"
  appendTo="body">
  <app-receita-form *ngIf="modalReceitaAberta()" [idAgendamento]="idAgendamento!" (aoSalvar)="fecharModais()"></app-receita-form>
</p-dialog>

<p-dialog 
  [(visible)]="modalExameAberto" 
  [modal]="true" 
  [draggable]="false" 
  [resizable]="false"
  styleClass="modal-agendamento"
  [style]="{ width: '100%', maxWidth: '600px' }"
  appendTo="body">
  <app-exame-form *ngIf="modalExameAberto()" [idAgendamento]="idAgendamento!" (aoSalvar)="fecharModais()"></app-exame-form>
</p-dialog>
