<div class="card form-card">
  <h2 class="form-title">Exame</h2>
  
  <div class="upload-area">
    <button class="btn-primary">Enviar</button>
    <span class="upload-hint">Apenas arquivos de tamanho X formato Y</span>
  </div>

  <div class="form-group">
    <label class="label">Nome do Exame</label>
    <input type="text" class="input-field" placeholder="Hemograma Completo" [(ngModel)]="nomeExame" />
  </div>

  <div class="form-group">
    <label class="label">Data do exame</label>
    <input type="date" class="input-field" [(ngModel)]="dataExame" />
  </div>

  <div class="form-group">
    <label class="label">Observações</label>
    <textarea class="input-field textarea" placeholder="Observações sobre o exame..." [(ngModel)]="observacoes"></textarea>
  </div>

  <div class="form-footer">
    <button class="btn-primary" (click)="salvar()">
      <i class="pi pi-bookmark"></i>
      Salvar
    </button>
  </div>
</div>
