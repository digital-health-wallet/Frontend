<div class="card form-card">
  <h2 class="form-title">{{ receitaParaEditar ? 'Editar Receita' : 'Receita' }}</h2>
  
  <div class="upload-area">
    <input type="file" #fileInput (change)="onFileSelected($event)" style="display: none;" accept=".pdf,image/png,image/jpeg">
    
    <p-button 
      styleClass="btn-primary" 
      label="Anexar" 
      icon="pi pi-upload" 
      rounded="true"
      severity="info"
      (onClick)="fileInput.click()">
    </p-button>
    
    <span class="upload-hint">{{ nomeArquivo ? nomeArquivo : 'PDF, PNG ou JPG' }}</span>
  </div>

  <div class="form-group">
    <label class="label">Data da receita</label>
    <input type="date" class="input-field" [(ngModel)]="dataReceita" />
  </div>

  <div class="form-group">
    <label class="label">Nome da medicação</label>
    <input type="text" class="input-field" placeholder="Ex: PraCurá 500mg, Pasta D'água 120mg" [(ngModel)]="medicacao" />
  </div>

  <div class="form-group">
    <label class="label">Posologia</label>
    <textarea class="input-field textarea" placeholder="Ex: 2 comprimidos 2x ao dia por 7 dias" [(ngModel)]="posologia"></textarea>
  </div>

  <div class="form-group checkbox-group">
    <label class="checkbox-container">
      <input type="checkbox" [(ngModel)]="usoContinuo" />
      <span class="checkmark"></span>
      Medicamento de uso contínuo
    </label>
  </div>

  <div class="form-footer">
    <p-button 
      [label]="carregando ? 'Salvando...' : (receitaParaEditar ? 'Atualizar' : 'Salvar')"
      [icon]="carregando ? 'pi pi-spinner pi-spin' : 'pi pi-bookmark'" 
      styleClass="btn-primary" 
      [disabled]="carregando"
      rounded="true"
      severity="info"
      (onClick)="salvar()">
    </p-button>
  </div>
</div>
