<div class="auth-page">
  <div class="auth-card card">
    <div class="auth-logo">
      <i class="pi pi-shield"></i>
    </div>
    <h1 class="auth-title">Digital Health Wallet</h1>

    @if (etapa() === 'email') {
      <form (ngSubmit)="solicitarCodigo()">
        <p class="auth-subtitle">Informe seu e-mail para receber um código de acesso</p>

        <div class="input-with-icon">
          <span class="icon-left"><i class="pi pi-envelope"></i></span>
          <input
            type="email"
            class="input-field"
            placeholder="E-mail"
            name="email"
            [(ngModel)]="email"
          />
        </div>

        @if (erro()) {
          <p class="auth-erro">{{ erro() }}</p>
        }

        <button type="submit" class="btn-primary auth-btn-entrar" [disabled]="carregando()">
          {{ carregando() ? 'Enviando...' : 'Enviar código' }}
        </button>
      </form>

      <div class="auth-divider"><span>ou</span></div>

      <button type="button" class="btn-google" (click)="entrarComGoogle()">
        <svg width="18" height="18" viewBox="0 0 18 18">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.91c1.7-1.57 2.69-3.88 2.69-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.81.54-1.84.86-3.05.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.96 10.71A5.4 5.4 0 0 1 3.68 9c0-.59.1-1.17.28-1.71V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.04l3-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l3 2.33C4.67 5.16 6.66 3.58 9 3.58z"/>
        </svg>
        Logar-se com Google
      </button>
    } @else {
      <form (ngSubmit)="confirmarCodigo()">
        <p class="auth-subtitle">Enviamos um código para <strong>{{ email }}</strong></p>

        <div class="input-with-icon">
          <span class="icon-left"><i class="pi pi-key"></i></span>
          <input
            type="text"
            class="input-field"
            placeholder="Código de verificação"
            name="codigo"
            [(ngModel)]="codigo"
          />
        </div>

        @if (erro()) {
          <p class="auth-erro">{{ erro() }}</p>
        }

        <button type="submit" class="btn-primary auth-btn-entrar" [disabled]="carregando()">
          {{ carregando() ? 'Verificando...' : 'Entrar' }}
        </button>

        <button type="button" class="btn-voltar-email" (click)="voltarParaEmail()">
          Usar outro e-mail
        </button>
      </form>
    }
  </div>
</div>
