<div class="page-header">Contatos</div>

<div class="profissionais-grid">

  <div class="prof-card add-card" (click)="abrirFormulario()">
    <div class="add-icon">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </div>
    <h3>Novo Contato</h3>
    <p>Cadastrar novo contato</p>
  </div>

  @for (contato of contatos(); track contato.id) {
    <div class="prof-card">

      <button class="btn-edit-card" (click)="abrirFormulario(contato)" title="Ver e Editar">
        <i class="pi pi-pencil"></i>
      </button>

      <div class="prof-avatar">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <h3>{{ contato.nome }}</h3>
      <p class="especialidade">{{ contato.parentesco }}</p>
      <p class="contato">{{ contato.telefone }}</p>
    </div>
  } @empty {

  }
</div>

<p-dialog
  [header]="form.id ? 'Editar Contato' : 'Novo Contato'"
  [(visible)]="exibirFormulario"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  styleClass="modal-agendamento">

  <div class="form-grid-modal">
    <div class="form-group full-width">
      <label class="label">Nome</label>
      <input class="input-field" placeholder="Ex: Maria Silva" [(ngModel)]="form.nome" />
    </div>

    <div class="form-group">
      <label class="label">Parentesco</label>
      <input class="input-field" placeholder="Ex: Mãe, Cônjuge" [(ngModel)]="form.parentesco" />
    </div>

    <div class="form-group">
      <label class="label">Telefone</label>
      <input class="input-field" placeholder="(00) 00000-0000" [(ngModel)]="form.telefone" />
    </div>

    <div class="form-group full-width">
      <label class="label">E-mail</label>
      <input class="input-field" placeholder="contato@email.com" [(ngModel)]="form.email" />
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="form-actions">
      <p-button
        class="btn-outline"
        size="large"
        label="Cancelar"
        severity="danger"
        [raised]="true"
        (onClick)="fecharFormulario()"
        styleClass="btn-outline-ajustado">
      </p-button>

      <p-button
        class="btn-outline"
        size="large"
        label="{{ form.id ? 'Atualizar Dados' : 'Salvar' }}"
        severity="info"
        [raised]="true"
        (onClick)="salvarContato()"
        styleClass="btn-outline-ajustado">
      </p-button>
    </div>
  </ng-template>
</p-dialog>
